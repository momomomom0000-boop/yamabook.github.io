<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="100%" height="100%">
  <defs>
    <style>
      .logo-a-frame { fill: none; stroke: #F3E4BB; stroke-width: 1; stroke-dasharray: 3 2; opacity: 0.85; }
      .logo-a-subframe { fill: none; stroke: #F3E4BB; stroke-width: 0.75; opacity: 0.5; }
      .logo-a-mono { fill: #F3E4BB; font-family: 'Cormorant Garamond', 'Times New Roman', serif; font-size: 26px; font-weight: 500; text-anchor: middle; letter-spacing: 0.1em; }
      .logo-a-text { fill: #F2EDE3; font-family: 'Cormorant Garamond', 'Times New Roman', serif; font-size: 14px; font-weight: 400; letter-spacing: 0.28em; text-anchor: middle; }
      .logo-a-jp { fill: #E3CECD; font-family: 'Noto Sans JP', sans-serif; font-size: 8px; font-weight: 300; letter-spacing: 0.35em; text-anchor: middle; opacity: 0.9; }
    </style>
  </defs>

  <!-- 左側：繊細なレース・ステッチ風フレームとモノグラムマーク -->
  <g transform="translate(45, 40)">
    <!-- 外枠（ステッチ風円） -->
    <circle cx="0" cy="0" r="32" class="logo-a-frame" />
    <!-- 内側の極細サークル -->
    <circle cx="0" cy="0" r="28" class="logo-a-subframe" />
    <!-- モノグラム "K" -->
    <text x="1" y="9" class="logo-a-mono">K</text>
  </g>

  <!-- 右側：タイポグラフィ（ブランド名） -->
  <g transform="translate(185, 42)">
    <text x="0" y="0" class="logo-a-text">KYOURITZ</text>
    <text x="2" y="16" class="logo-a-jp">フォトスタジオ</text>
  </g>
</svg>
