<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="100%" height="100%">
  <defs>
    <style>
      .badge-bg { fill: #3E312D; stroke: #F3E4BB; stroke-width: 2; }
      .badge-ring { fill: none; stroke: #F3E4BB; stroke-width: 1; stroke-dasharray: 2 2; }
      .badge-text-num { fill: #F2EDE3; font-family: 'Cormorant Garamond', 'Times New Roman', serif; font-size: 26px; font-weight: 600; text-anchor: middle; letter-spacing: 0.05em; }
      .badge-text-sub { fill: #F3E4BB; font-family: 'Cormorant Garamond', 'Times New Roman', serif; font-size: 9px; font-weight: 500; text-anchor: middle; letter-spacing: 0.2em; }
      .badge-star { fill: #F3E4BB; }
    </style>
  </defs>

  <!-- 外側の円（ココアブラウンのベース ＆ フレッシュバナナの縁） -->
  <circle cx="40" cy="40" r="37" class="badge-bg" />

  <!-- 内側の繊細な破線サークル（手触り感・レース風のアクセント） -->
  <circle cx="40" cy="40" r="32" class="badge-ring" />

  <!-- 上部の小さなアクセント星 -->
  <polygon points="40,11 41.5,14.5 45,15 42.5,17.5 43,21 40,19.2 37,21 37.5,17.5 35,15 38.5,14.5" class="badge-star" />

  <!-- テキスト部分（RANKING と 01） -->
  <text x="40" y="33" class="badge-text-sub">RANKING</text>
  <text x="40" y="57" class="badge-text-num">01</text>
</svg>
